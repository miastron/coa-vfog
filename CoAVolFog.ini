; CoAVolFog settings. Changes apply within a second while the game runs,
; except Enable, EngineHooks and LightStay, which need a client restart.
[CoAVolFog]
Enable=1
EngineHooks=1
; 1 = keep point lights (torches, braziers, spell lights) enabled while their model is not drawn, as patch No. 70
; "lightstay" of St0ny's AIO WoW EXE Patcher does: one byte of the client's light query (je -> jmp at 0x81E548),
; written in memory once at start-up after checking the client's code, and accepted when the exe already carries
; it. Needs EngineHooks=1; the log says whether it was applied. Without it the client switches a light off as soon
; as its source leaves the frame, on the figure beside it and in the fog. A source that moves while off-screen
; keeps lighting its last drawn spot until it is drawn again.
; 0 = the client's own behaviour
LightStay=1

; In-game settings window, shown and hidden with OverlayKey. It changes the settings below live; its Save button
; writes the changed ones back to this file and keeps the comments. 0 = off (turning it on again needs a client
; restart; with 0 at start-up the game window is left untouched)
Overlay=1
; F1-F24, Insert, Delete, Home, End, PageUp, PageDown, Pause, ScrollLock, a letter or a digit, with optional Ctrl+,
; Shift+ and Alt+ in front
OverlayKey=Ctrl+F7

; 1 = quarter resolution, 16 steps; 2 = half resolution, 24 steps; 3 = half resolution, 32 steps
Quality=2

; Global density multiplier, then the layers used where no Classic data exists: distance haze, low
; ground mist, and the distance fog that replaces the stock fog (FarFog)
Density=1.0
Haze=1.0
GroundFog=0.6
FarFog=1.0

; World-anchored density variation in scene layers; 0 keeps the authored density smooth.
; Amount 0..1 varies density between 1-amount and 1+amount without changing its spatial mean.
; Scale 0.001..1 controls patch size (larger is smaller); wind 0..10 drifts along world +X in yd/s.
; The distance fog remains smooth to preserve the far-clip transition.
NoiseAmount=0.15
NoiseScale=0.025
NoiseWindSpeed=0.5
; 1 = drifting fog banks where the Classic layers carry the modern client's noise (mostly storms); it thins those
; layers to about half their density on average, and the variation above does not apply to them.
; 0 = off, the variation above applies instead
ClassicNoise=1

; 1 = replace the client's linear fog with the volumetric distance fog, 0 = keep the stock fog
StockFog=1
; 1 = fog particles, spell effects and other see-through models by their own distance, as the stock client does:
; the fog is drawn after the water and before them, each of them gets a linear fog fitted to the volumetric fog
; within 100 yd, and the sun and moon glare is drawn just before the fog. Farther away the same line is extended, so
; distant effects and models fading in or out can be fogged noticeably more or less than the scene around them (by up
; to about 0.4 of their visibility between 100 and 600 yd in tests), and past the line's end, 500 to 900 yd in tests,
; they are fully fogged: distant glows vanish. World-name text and lightning, missile and barrier effects then look
; as in the stock client, weather keeps its own 70-75 yd fade as in the stock client, and see-through parts of
; buildings, such as windows, still take the fog of the scene behind them. Applies above water while StockFog=1,
; without a debug view or the sun marker.
; 0 = the fog is drawn once after the whole world, so see-through effects take the fog of the scene behind them
TransparentFog=0

; 1 = use the Classic client's fog layers where its lights cover the map, 0 = derived layers everywhere
DataMode=1
; 1 = scatter and blend in linear light like the modern client, with a soft highlight roll-off; 0 = gamma
ColorSpace=1

; In-scattered sun or moon light (the halo around it) and ambient fog brightness
SunScatter=1.0
Ambient=1.0
Exposure=1.0
; Brightness of the Classic layers (1 = as authored; the modern client applies no exposure to its fog)
ClassicExposure=1.0
; How the Classic layers scatter the sun and moon: 0 = the phase peaks at 1 toward the light;
; 1 = energy-normalised, as the authored intensities suggest the modern client does: the horizon band of the far,
; evenly scattering layers about 12 times dimmer, the halo of strongly forward layers larger and much brighter
ClassicPhase=0

; Scatter up to eight world point lights in view into the fog; intensity range 0..8
LocalLights=1
LocalLightIntensity=1.0
; How every point light scatters in the fog (one value for all lights, as the modern client does), -0.9..0.9:
; 0 = evenly in every direction; toward 0.9 mostly the fog between you and the light; below 0 the fog behind the
; light, steeply brighter toward -0.9. The modern client's value is not known; 0.3 is a calibration
LocalLightPhase=0.3
; 1 = a light fades out with its lamp or fire when the game stops drawing that object in view (too far away for your
; Environment Detail, or hidden), and returns with it; lights just outside the view stay on (see LightStay).
; 0 = every light in the client's table shines at any distance
LightsFollowObjects=1
; Let glowing spell effects (fire, frost, arcane, shadow, shields...) light the fog around them in their own colour.
; They share the eight light slots with the world's lights and need LocalLights=1; intensity range 0..8
SpellLights=1
SpellLightIntensity=1.0
; Let the same eight point and spell lights also light the ground, walls and models around them (no shadows), 0..2,
; strongest at night where the world's own light is dim. Needs LocalLights=1; Local/SpellLightIntensity scale it too.
; 0 = off
SurfaceLights=1.0
; Fade outdoor layers and sunlight using the camera's building/cave transition.
; InteriorDensity is the fraction of outdoor layer density retained indoors (0..1).
; InteriorFarFog is the fraction of native distance-fog density retained indoors (0..1).
; 1.0 preserves native interior distance fog; lower values (0.15 to 0.4 in testing) clear dungeon haze.
; This follows the camera, not individual rooms along each ray.
InteriorAware=1
InteriorDensity=0.15
InteriorFarFog=1.0
; Shadowed in-scattering: terrain, buildings and trees block the sun or moon light in the fog, so it shines through
; only where the light reaches (light shafts). Terrain blocks it from the map's heights around the camera, in view
; or not; buildings and trees are traced through the depth of the image where no shadow map covers.
LightShafts=1
; Use the client's world shadow maps when available, so casters outside the view block the light too. Needs
; LightShafts=1 and the client's shadow rendering; where no map covers, the depth of the image is traced instead
WorldShadows=1
; Radial god rays from the bright sky around the sun, 0 = off (the client's glow already brightens the sun)
GodRays=0
; 1 = pre-compensate the fog for the client's full-screen glow (ffxGlow), which otherwise bleaches bright
; fog around the sun to white; 0 = off
GlowCompensation=1
; 1 = the modern client's glow amount (LightParams.Glow, 0 on most continent lights) where Classic lights cover
; the camera, fading back to the client's own glow at the edge of that coverage; it replaces the client's amount,
; Ascension's ambientGlow included, but never the ghost view's. 0 = the client's own glow
ForeverGlow=0
; Strength of the modern client's colour curve for the lights around the camera, 0..1: brighter midtones, and the
; brightest highlights clipped to white. It grades the 3D view after the glow; names, the interface, the ghost view
; and the view under water are not graded. 0 = off
ColorGrading=0
; Bloom, 0..1: a soft halo of light around the brightest parts of the 3D view (the sun, bright sky, spells and
; lamps) at the end of the world render, before names and the interface. It adds to the client's own full-screen
; glow (see ForeverGlow above). 0 = off
Bloom=0

; Anisotropic filtering of the game's textures: 0 = the game's own, 2, 4, 8 or 16 = at least that many samples
; on every mipmapped texture, up to what the graphics card supports. The game's Texture Filtering option only
; reaches models; the ground, buildings and grass always stay trilinear and turn blurry at grazing angles
AnisotropicFiltering=16

; View distance in yards on the continents (Eastern Kingdoms, Kalimdor, Outland, Northrend), which Ascension
; caps at 791. Up to 1583 (the engine's limit, used in instances), within the client's own farclip setting.
; 0 = leave the client's cap. Turning it on when it was 0 at start-up needs a client restart; other changes,
; including 0, apply at the next farclip change, map load or zone change (e.g. "/console farclip 1583"), and
; raising it shows a loading screen at that moment. Costs about four times the loaded terrain.
FarClipMax=1583

; Fog range in yards: how far sky rays are integrated and the scale of the Classic distance curves
MaxDistance=5000
; History weight of the temporal filter, 0 = off
Temporal=0.85
; Keep the effect while the camera is under water
Underwater=0
; Let water surfaces write depth so water is fogged by its own distance (always on while modern water is drawn)
LiquidDepth=1
; 1 = keep the game's Multisampling video option (smoother edges) when the graphics driver can copy the
; multisampled depth for the fog and water: NVIDIA through NVAPI, AMD and Intel through RESZ. The copy is tested
; when the game creates its display; if it fails, multisampling stays off and CoAVolFog.log says why.
; 0 = multisampling off, as before. The game lists its Multisampling choices once per start, so turning this on
; takes effect after restarting the game; turning it off applies the next time the game resets its display, for
; example after changing Multisampling or the resolution in its Video options
Multisampling=1

; 1 = SMAA antialiasing of the 3D view at the end of the world render, before names and the interface: it
; smooths jagged edges, also those the game's multisampling misses (leaves, grass, fences, hair), and works with
; or without multisampling. 0 = off
Antialiasing=0
; Contrast-adaptive sharpening of the 3D view, 0..1, at the end of the world render before names and the
; interface: it brings back detail that blurry textures, antialiasing and the fog soften, more in flat areas than
; at edges that already have contrast. 0 = off
Sharpening=0

; Modern water: lakes, rivers, the sea and indoor pools are shaded like the modern client, with moving waves,
; refraction, foam, sun highlights and reflections. Magma and slime keep the client's look. While modern water is
; drawn (Water=1, waterdata.bin installed, camera above water), water surfaces write depth whatever LiquidDepth says.
; 1 = on, 0 = the client's own water
Water=1
; 1 = low: 128 waves, sky reflections only; 2 = medium: 256 waves, scene reflections;
; 3 = high: 256 waves, finer scene reflections
WaterQuality=2
; Wave height, 0..2; 0 = flat water
WaterWaves=1.0
; Wind that drives the waves, 0.5..10; stronger wind makes longer, rougher waves
WaterWind=2.0
; Foam on wave crests, 0..2; 0 = no crest foam
WaterFoam=1.0
; Foam along shores and in shallow water, 0..2; 0 = none. Its band is measured by the water's depth, so it looks the
; same from a low camera as from above. Rivers use the lake's shore foam
WaterShoreFoam=1.0
; Small waves washing in and out at the waterline, 0..2: the thin water at the edge drains back and runs in again
; with a foam line at its front, every few seconds on lakes, slower and wider on the sea, faintly on rivers, out of
; step along the coast. The waterline can only draw back from where the client draws it, not climb the beach.
; 0 = a still waterline
WaterShoreWaves=1.0
; Reflections of the sky and the scene, 0..2; 0 = none
WaterReflections=1.0
; Highlight of the sun or moon on the water, 0..4; 0 = none
WaterSpecular=1.0
; How far you see into the water, 0.25..4; larger is clearer
WaterClarity=1.0
; How much the zone's own water colours (from the client's day and night lights) tint the water, 0..1;
; 0 = the modern colours only
WaterZoneColors=0.5
; Ripples and wakes where players, creatures, pets and mounts move through or jump into water, 0..2: a unit
; moving faster than the ripples spread (about 2.6 yd/s, a run or a swim) drags a thin V behind it, starting and
; stopping each send out one ring, a splash marks jumping in, and a unit standing still leaves the water calm
; with only a faint distortion at its feet. 0.5 is the default strength; 0 = none (no ripple simulation and no
; reading of the units around you)
WaterRipples=0.5
; The client's own flat splash discs and white V-shaped wake trails: 0 = hidden while the modern water and its
; ripples are drawn (the client's waterRipples console value is held at 0 and put back when they stop; they stay
; when the ripples cannot run), 1 = keep them on top of the ripples. Hiding them is all or nothing: ripples reach
; only about 24 yd around your character (10 yd at WaterQuality=1) and the 32 nearest units, and only on the
; modern water, so a unit farther away or in a liquid the client draws itself leaves no wake while they are hidden
WaterClientSplashes=0
; 0 = off, 1 = wave normals, 2 = foam, 3 = transmittance, 4 = reflection, 5 = liquid class, 6 = ripples
WaterDebugView=0

; 0 = off, 1 = fog radiance only, 2 = transmittance, 3 = linear depth
DebugView=0
; Red marker where the sun direction projects on screen
SunMarker=0
; 0 = errors, 1 = info, 2 = debug
LogLevel=1
